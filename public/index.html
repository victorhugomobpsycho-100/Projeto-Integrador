<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro de Usuários</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Cadastro de Usuários</h1>

<p id="mensagem"></p>
<script src="script.js" defer></script>
</body>
</html>
