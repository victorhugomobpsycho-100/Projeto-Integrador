<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Criar conta</h1>

    <form id="signup-form">
      <div class="row">
        <div class="field">
          <label for="first-name">Primeiro nome</label>
          <input type="text" id="first-name" name="firstName" placeholder="Nome" required>
        </div>

        <div class="field">
          <label for="last-name">Último nome</label>
          <input type="text" id="last-name" name="lastName" placeholder="Sobrenome" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="birth-date">Nascimento</label>
          <input type="text" id="birth-date" name="birthDate" placeholder="dd/mm/aaaa" inputmode="numeric" maxlength="10" required>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="********" required minlength="8">
        </div>

        <div class="field">
          <label for="confirm-password">Confirmar senha</label>
          <input type="password" id="confirm-password" name="confirmPassword" placeholder="********" required minlength="8">
        </div>
      </div>

      <div class="field">
        <label for="gender">Gênero</label>
        <select id="gender" name="gender">
          <option value="" disabled selected>Selecione</option>
          <option value="masculino">Masculino</option>
          <option value="feminino">Feminino</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div class="submit-row">
        <button type="submit" class="submit">Criar conta</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
